# .github/workflows/deploy.yml
# Construye y publica en GitHub Pages en cada push a main.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm test

      # La URL del Apps Script es una VARIABLE del repositorio (no un secreto):
      # Settings → Secrets and variables → Actions → Variables → VITE_SYNC_URL.
      # El código de acceso nunca entra en el build.
      - run: npm run build
        env:
          VITE_SYNC_URL: ${{ vars.VITE_SYNC_URL }}

      - name: Avisar si falta la URL del Apps Script
        env:
          SYNC: ${{ vars.VITE_SYNC_URL }}
        run: |
          [ -n "$SYNC" ] \
            && echo "Apps Script configurado: la app sincroniza con la hoja." \
            || echo "::warning::Variable VITE_SYNC_URL no definida: la app funcionará solo en el dispositivo."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
